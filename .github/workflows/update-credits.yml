name: 📜 OzBays - Update Credits

# Rebuilds resources/credits/credits.json (the website's Copyright & Usage page) on every push to a PR,
# and commits it to the PR branch if it changed. Merging the PR then deploys it with the other site files.
on:
  pull_request:
    branches:
      - live-site
      - Next-Release
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: update-credits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  credits:
    name: 📜 Update Copyright & Usage Credits
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      # PRs from this repo: regenerate and commit any changes back to the PR branch
      - name: 🔄 Generate credits
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: php scripts/generate-credits.php

      - name: 💾 Commit updated credits
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add resources/credits/credits.json
          if git diff --cached --quiet; then
            echo "Credits already up to date."
          else
            git commit -m "Update Copyright & Usage credits"
            git push
          fi

      # PRs from forks can't be pushed to - just check the file is up to date
      - name: ✅ Check credits are up to date (forks)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: php scripts/generate-credits.php --check
